version: "3.8"

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: oshi_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: oshi_prod
    volumes:
      - oshi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d oshi_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: oshi_api
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres:5432/oshi_prod
      APP_NAME: OSHI
      APP_ENV: production
      DEBUG: "false"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: oshi_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60 1", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - oshi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Migration dijalankan sekali sebagai init-job sebelum API/worker start.
  # Setiap replica worker/API tidak boleh menjalankan alembic secara paralel
  # karena akan membuat lock contention terhadap tabel alembic_version.
  migration:
    build: .
    container_name: oshi_migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres:5432/oshi_prod
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    restart: "no"

  worker:
    build: .
    container_name: oshi_worker
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres:5432/oshi_prod
      APP_NAME: OSHI
      APP_ENV: production
      DEBUG: "false"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: ["celery", "-A", "packages.core.celery_app.celery_app", "worker", "--loglevel=info"]
    restart: unless-stopped

volumes:
  oshi_postgres_data:
  oshi_redis_data:
