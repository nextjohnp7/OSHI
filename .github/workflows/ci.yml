name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: oshi
          POSTGRES_PASSWORD: oshi
          POSTGRES_DB: oshi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oshi -d oshi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync dependencies
        run: |
          uv sync --dev

      - name: Run database migrations
        run: |
          uv run alembic upgrade head

      - name: Run tests
        run: |
          uv run pytest tests/ -v
        env:
          OSHI_TEST_DATABASE_URL: postgresql://oshi:oshi@localhost:5432/oshi_test

      - name: Run lint (ruff check)
        run: |
          uv run ruff check

      - name: Run format check (ruff format)
        run: |
          uv run ruff format --check
