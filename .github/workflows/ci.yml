name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: oshi
          POSTGRES_PASSWORD: oshi
          POSTGRES_DB: oshi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oshi -d oshi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install postgresql-client
        run: |
          sudo -S -p '' apt-get update -y && sudo -S -p '' apt-get install -y postgresql-client

      - name: Sync dependencies
        run: |
          uv sync --dev --group prod

      - name: Run database migrations
        run: |
          export DATABASE_URL="postgresql://oshi:${PGPASSWORD}@localhost:5432/oshi_test"
          uv run alembic upgrade head
        env:
          PGUSER: oshi
          PGPASSWORD: oshi
          PGDATABASE: oshi_test
          PGHOST: localhost
          PGPORT: 5432

      - name: Run tests
        run: |
          export OSHI_TEST_DATABASE_URL="postgresql://oshi:${PGPASSWORD}@localhost:5432/oshi_test"
          uv run pytest tests/ -v
        env:
          PGUSER: oshi
          PGPASSWORD: oshi
          PGDATABASE: oshi_test
          PGHOST: localhost
          PGPORT: 5432

      - name: Run lint (ruff check)
        run: |
          uv run ruff check

      - name: Run format check (ruff format)
        run: |
          uv run ruff format --check
